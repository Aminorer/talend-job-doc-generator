# Configuration par défaut pour Talend Documentation Generator
ollama:
  base_url: "http://localhost:11434"
  model: "llama3"
  timeout: 120

generator:
  default_template: "job_standard.md"
  output_dir: "docs/output"

diagrams:
  style: "TD"

pdf:
  font: "Helvetica"
  font_size: 12
  margin: 10

logging:
  env: "dev"            # dev ou prod
  level: "INFO"         # DEBUG, INFO, WARNING, ERROR, CRITICAL
  log_dir: "logs"
  filename: "app.log"
  max_bytes: 10485760   # 10 MB
  backup_count: 5
